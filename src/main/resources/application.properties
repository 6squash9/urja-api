spring.application.name=urja-api
server.port=8080

# --- Urja Meter Ops portal ---
portal.base-url=https://urja-ops.flockenergy.tech
# Credentials come from environment variables so they never live in the code or on GitHub.
portal.email=${PORTAL_EMAIL:}
portal.password=${PORTAL_PASSWORD:}

# --- Cache ---
# How often the meter + transformer cache is re-downloaded from the portal (default: 10 minutes).
cache.refresh-interval-ms=600000
